name: Release

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/OpenNDOF.App/OpenNDOF.App.csproj

      - name: Publish app (win-x64)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver -match '^v\d+\.\d+\.\d+$') { $ver = $ver.Substring(1) }
          else { $ver = "1.0.0.${{ github.run_number }}" }
          dotnet publish src/OpenNDOF.App/OpenNDOF.App.csproj -c Release -r win-x64 --self-contained false -o artifacts/OpenNDOF-Bridge "/p:Version=$ver"

      - name: Zip publish output
        shell: pwsh
        run: Compress-Archive -Path artifacts/OpenNDOF-Bridge/* -DestinationPath artifacts/OpenNDOF-Bridge-win-x64.zip -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # The COM host cannot activate without TDxInput.runtimeconfig.json
          # beside it — fail fast rather than ship a broken installer.
          if (-not (Test-Path 'artifacts\OpenNDOF-Bridge\TDxInput.runtimeconfig.json')) {
            throw 'Missing artifacts\OpenNDOF-Bridge\TDxInput.runtimeconfig.json — COM activation would fail (0x80008093).'
          }
          $is = Join-Path $env:TEMP 'innosetup-install.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $is
          Start-Process -FilePath $is -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$env:TEMP\innosetup" -Wait
          # AppVersion is read from the published exe via GetFileVersion.
          & (Join-Path $env:TEMP 'innosetup\ISCC.exe') installer/OpenNDOF.iss

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OpenNDOF-Bridge-win-x64
          path: |
            artifacts/OpenNDOF-Bridge-win-x64.zip
            artifacts/OpenNDOF-Setup.exe
          if-no-files-found: error

      # Every push to master publishes a rolling pre-release (tag "continuous",
      # recreated on each build) so testers always have the freshest zip.
      - name: Publish continuous pre-release
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Roll the continuous release: drop the previous one (ignore if
          # absent), then publish a fresh prerelease with the current assets.
          gh release delete continuous --yes --cleanup-tag 2>$null
          gh release create continuous --prerelease --title "Continuous build (master)" --notes "Latest build from master. Install: run OpenNDOF-Setup.exe (registers the COM server automatically)." --target "${{ github.sha }}" artifacts/OpenNDOF-Bridge-win-x64.zip artifacts/OpenNDOF-Setup.exe

      # v* tags produce stable releases with auto-generated release notes.
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --title "${{ github.ref_name }}" artifacts/OpenNDOF-Bridge-win-x64.zip artifacts/OpenNDOF-Setup.exe