name: Release

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/OpenNDOF.App/OpenNDOF.App.csproj

      - name: Publish app (win-x64)
        run: dotnet publish src/OpenNDOF.App/OpenNDOF.App.csproj -c Release -r win-x64 --self-contained false -o artifacts/OpenNDOF-Bridge

      - name: Zip publish output
        shell: pwsh
        run: Compress-Archive -Path artifacts/OpenNDOF-Bridge/* -DestinationPath artifacts/OpenNDOF-Bridge-win-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenNDOF-Bridge-win-x64
          path: artifacts/OpenNDOF-Bridge-win-x64.zip

      # Every push to master publishes a rolling pre-release (tag "continuous",
      # recreated on each build) so testers always have the freshest zip.
      - name: Publish continuous pre-release
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create continuous --prerelease --title "Continuous build (master)" --notes "Latest build from master. Install: unzip, run OpenNDOF.App.exe; register the COM server with Register-ComServer.ps1 (admin) for CAD apps." --target "${{ github.sha }}" artifacts/OpenNDOF-Bridge-win-x64.zip `
            || { gh release delete continuous --yes --cleanup-tag; gh release create continuous --prerelease --title "Continuous build (master)" --notes "Latest build from master. Install: unzip, run OpenNDOF.App.exe; register the COM server with Register-ComServer.ps1 (admin) for CAD apps." --target "${{ github.sha }}" artifacts/OpenNDOF-Bridge-win-x64.zip; }

      # v* tags produce stable releases with auto-generated release notes.
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --title "${{ github.ref_name }}" artifacts/OpenNDOF-Bridge-win-x64.zip