name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore OpenNDOF.slnx

      - name: Build
        run: dotnet build OpenNDOF.slnx --configuration Release --no-restore

      - name: Test (Unit)
        run: dotnet test tests/OpenNDOF.UnitTests/OpenNDOF.UnitTests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults --verbosity minimal

      - name: Test (Integration)
        run: dotnet test tests/OpenNDOF.IntegrationTests/OpenNDOF.IntegrationTests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults --verbosity minimal

      - name: Test (Other)
        run: dotnet test tests/OpenNDOF.OtherTests/OpenNDOF.OtherTests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults --verbosity minimal

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: TestResults
          if-no-files-found: error