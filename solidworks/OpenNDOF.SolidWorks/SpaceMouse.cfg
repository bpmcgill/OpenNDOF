# OpenNDOF SOLIDWORKS add-in settings - re-read as soon as this file is saved.
# Per-axis sensitivity: OpenNDOF dashboard > Configuration (profile with app name
# "sldworks", else "default"), also applied live.
#
# Axis mapping: <channel>=<sign><device axis>
#   channels: panx pany zoom tilt spin roll
#   axes:     tx ty tz rx ry rz
panx=+tx,pany=+ty,zoom=-tz,tilt=+rx,spin=-rz,roll=-ry
#
# rot   rotation speed at full deflection (degrees/second)
# zoom  zoom factor per second at full deflection
# pan   pan speed (quarter view widths/second, independent of zoom)
# dz    dead zone (0..0.9 of full scale)
# tau   low-pass time constant (seconds)
# hz    update rate (10..250)
# xtalk fade out axes weaker than this fraction of the strongest one
#       (gone below half of it, full weight above it; 0 = off)
rot=360 zoom=8 pan=3 dz=0.06 tau=0.05 hz=60 xtalk=0.3
